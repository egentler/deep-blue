# Deep Blue | GitHub Pages + Jekyll
# For a repository named deep-blue, this is the correct test address.
# When we connect deepbluelr.com, change baseurl to "".
title: Deep Blue
description: Student writing, photography, and visual art
url: "https://YOUR-USERNAME.github.io" # Optional metadata; update after setup.
baseurl: "/deep-blue"     # If your repository has another name, change this.
permalink: /work/:title/
markdown: kramdown
exclude:
  - README.md
  - UPLOAD-INSTRUCTIONS.txt
  - LICENSE
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
