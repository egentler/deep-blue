# Deep Blue | GitHub Pages + Jekyll
# Production settings for the custom domain deepbluelr.com.
# Upload when switching your custom domain, not before.
title: Deep Blue
description: Student writing, photography, and visual art
url: "https://deepbluelr.com"
baseurl: ""
permalink: /work/:title/
markdown: kramdown
exclude:
  - README.md
  - UPLOAD-INSTRUCTIONS.txt
  - LICENSE
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
