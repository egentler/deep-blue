<dialog id="deepblue-image-viewer" class="deepblue-viewer" aria-label="Full-size artwork viewer">
  <button type="button" class="viewer-close" data-viewer-close aria-label="Close image viewer">×</button>
  <div class="viewer-image-wrap"><img class="viewer-image" data-viewer-image alt=""></div>
  <div class="viewer-controls">
    <button type="button" class="viewer-arrow" data-viewer-prev aria-label="Previous image">←</button>
    <div class="viewer-caption"><span data-viewer-title></span><small data-viewer-credit></small></div>
    <button type="button" class="viewer-arrow" data-viewer-next aria-label="Next image">→</button>
  </div>
</dialog>
