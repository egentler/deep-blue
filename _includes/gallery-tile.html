{% assign piece = include.post %}
{% assign is_series = false %}
{% if piece.series_images and piece.series_images.size > 0 %}{% assign is_series = true %}{% endif %}
<figure class="gallery-tile{% if include.lead %} gallery-tile--lead{% endif %}{% if is_series %} gallery-tile--series{% endif %}">
  {% if piece.cover and piece.cover != '' %}
    {% if is_series %}
    <button type="button" class="gallery-image-button gallery-image-button--series" data-open-series data-series-id="series-{{ piece.id | slugify }}" aria-label="Open series {{ piece.title | escape }}; {{ piece.series_images.size | plus: 1 }} images">
      <span class="gallery-image-stage"><img src="{{ piece.cover | relative_url }}" alt="{{ piece.title | escape }} — series cover" loading="lazy"></span>
    </button>
    {% else %}
    <button type="button" class="gallery-image-button" data-open-image data-group="{{ include.group }}" data-src="{{ piece.cover | relative_url }}" data-title="{{ piece.title | escape }}" data-credit="{{ piece.author | default: 'Student contributor' | escape }}" aria-label="View full-size image: {{ piece.title | escape }}">
      <span class="gallery-image-stage"><img src="{{ piece.cover | relative_url }}" alt="{{ piece.title | escape }}" loading="lazy"></span>
    </button>
    {% endif %}
  {% else %}<div class="gallery-image-stage gallery-missing">Image coming soon</div>{% endif %}
  <figcaption class="gallery-caption"><strong>{{ piece.title | escape }}</strong><span>{{ piece.author | default: 'Student contributor' | escape }}{% if piece.medium %} · {{ piece.medium | escape }}{% endif %}</span>
  {% if is_series %}<span class="series-label">Series <span aria-hidden="true">·</span> {{ piece.series_images.size | plus: 1 }} images</span>{% endif %}</figcaption>
</figure>
{% if is_series and piece.cover and piece.cover != '' %}
{% include series-template.html post=piece %}
{% endif %}
