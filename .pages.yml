# Pages CMS editing interface for Deep Blue
media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
content:
  - name: posts
    label: Student work
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, date, category, published, author]
      sort: [date, published, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title of piece
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Writing, Visual Art, Wavelengths, Photography, Neighbors]
      # Legacy Photography items stay valid; new photo/audio/video posts use Wavelengths.
      - name: audio_file
        label: Audio composition (MP3 recommended)
        type: file
        options:
          categories: [audio]
        description: Optional for Wavelengths. Upload an MP3 or M4A; new entries will get an audio player. Best for short, compressed audio. Leave blank for photographs and videos.
      - name: video_file
        label: Performance video file (small MP4 only)
        type: file
        options:
          categories: [video]
        description: Optional. Small MP4 works, but for large videos use a YouTube/Vimeo URL below instead, because GitHub Pages limits file sizes.
      - name: video_url
        label: Performance video link (YouTube or Vimeo)
        type: string
        description: Optional. Paste a public or unlisted YouTube or Vimeo watch URL. Best for larger videos; do not also upload a video file for the same piece.
      - name: captions_file
        label: Video captions (optional WebVTT)
        type: file
        options:
          extensions: [vtt]
        description: Optional .vtt captions for a directly uploaded video. YouTube/Vimeo captions are configured on their platforms.
      - name: published
        label: Published
        type: boolean
        default: true
        description: On = visible on Deep Blue. Off = draft saved in Pages CMS and GitHub, hidden from the public website. Your GitHub repository and uploaded media are still public.
      - name: author
        label: Byline (use approved name or anonymous credit)
        type: string
      - name: summary
        label: Short description for the homepage
        type: text
      - name: preview
        label: Text preview (especially for writing)
        type: text
        description: Optional few lines used on the homepage when no cover image is provided
      - name: cover
        label: Photo or artwork
        type: image
        description: Upload the actual image; optional for writing
      - name: medium
        label: Medium / caption
        type: string
        description: Optional, for example Oil on canvas or Digital photograph
      - name: cover_credit
        label: First image artist (optional, for series)
        type: string
        description: If different people made the images, credit the cover image here.
      - name: cover_caption
        label: First image caption (optional, for series)
        type: string
      - name: show_cover_in_series
        label: Show cover image inside the full series?
        type: boolean
        default: true
        description: Turn this off when the cover is a composite or specially designed thumbnail. It will still appear on the homepage, but only the Additional images will appear in the opened series. Leave on for existing series.
      - name: series_images
        label: Additional images — make this entry a series
        type: object
        description: Leave empty for a single image. Add images in display order. If you turn off Show cover image inside the full series, these are the only images visitors will see after opening the series.
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: image
            label: Additional image
            type: image
            required: true
          - name: artist
            label: Artist credit for this image
            type: string
          - name: caption
            label: Image caption / title
            type: string
      - name: sample
        label: Sample entry (mark true for placeholders only)
        type: boolean
        default: false
      - name: body
        label: Full text / artist statement / series introduction
        type: rich-text
  - name: site_settings
    label: Site wording
    type: file
    path: _data/site.yml
    format: yaml
    fields:
      - name: tagline
        label: Homepage introduction
        type: text
      - name: about
        label: About Deep Blue
        type: text
      - name: demo_mode
        label: Show sample-content notice
        type: boolean
